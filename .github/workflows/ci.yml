name: Portfolio examples
# 同一PRの古い実行だけを置き換え、pushの検証は中断しない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        project:
          - ai-agent
          - data-analysis
          - web-scraper
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run API-free mock demo
        if: matrix.project == 'ai-agent'
        run: python run_demo.py --mock
      - name: Run synthetic data pipeline
        if: matrix.project == 'data-analysis'
        run: python run_all.py
